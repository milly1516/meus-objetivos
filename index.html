<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Objetivos do Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="cabecalho-principal">
    <h1>Meus Objetivos do Ano</h1>
  </header>

  <main id="conteudo-principal">
    <nav id="menu-botoes">
      <button class="botao ativo">Cursos na Alura</button>
      <button class="botao">Projetos JS</button>
      <button class="botao">Criar Portfólio</button>
      <button class="botao">Atualizar Currículo</button>
    </nav>

    <section id="painel-conteudo">
      <div class="aba-conteudo ativo" id="conteudo-aba1">
        <h2>Cursos na Alura</h2>
        <p class="contador" id="tempo0"></p>
      </div>
      <div class="aba-conteudo" id="conteudo-aba2">
        <h2>Criar projetos em JavaScript</h2>
        <p class="contador" id="tempo1"></p>
      </div>
      <div class="aba-conteudo" id="conteudo-aba3">
        <h2>Criar um portfólio</h2>
        <p class="contador" id="tempo2"></p>
      </div>
      <div class="aba-conteudo" id="conteudo-aba4">
        <h2>Atualizar meu currículo</h2>
        <p class="contador" id="tempo3"></p>
      </div>
    </section>
  </main>

  <footer id="rodape-pagina">
    <p>Desenvolvido como projeto de estudos na Alura.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
